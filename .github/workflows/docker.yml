name: PLX Docker
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - bin/**
      - templates/**
      - webfrontend/**
      - docker/**
      - tests/**
      - .github/workflows/docker.yml
  pull_request:
    paths: [Dockerfile, .dockerignore, compose.yaml, compose.registry.yaml, "bin/**", "templates/**", "webfrontend/**", "docker/**", "tests/**", .github/workflows/docker.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plx-docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLX_HOST: 127.0.0.1
      PLX_BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli mosquitto mosquitto-clients
          python -m pip install --require-hashes -r bin/requirements.lock.txt
          python -m pip install pytest==8.4.2
      - name: Unit and local integration tests
        run: python -m pytest tests -q
      - name: Build and smoke-test standalone container
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 90
          docker compose exec -T plx python /app/healthcheck.py
          docker compose exec -T plx python -c 'import os,json; assert os.getuid()==10001; c=json.load(open("/data/config/settings.json")); assert not c["enabled"] and not c["mqtt"]["enabled"] and not c["vehicles"]'
      - name: Stop isolated test container
        if: always()
        run: docker compose down -v
  publish:
    if: github.repository == 'square-com-de/plx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/square-com-de/plx:edge
            ghcr.io/square-com-de/plx:sha-${{ github.sha }}
