name: PLX documentation
on:
  pull_request:
    paths: ['**.md', 'docs/**', 'tools/check_docs.py', '.github/workflows/documentation.yml']
  push:
    branches: [main]
    paths: ['**.md', 'docs/**', 'tools/check_docs.py', '.github/workflows/documentation.yml']
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate links, commands and runtime boundaries
        run: python tools/check_docs.py
