name: PLX LoxBerry package
on:
  pull_request:
    paths: [plugin.cfg, tools/build.py, tools/prepare_loxberry_release.py, tools/test_loxberry_release.py, docs/RELEASE-0.1.5.md, .github/workflows/loxberry-release.yml]
  push:
    branches: [main]
    paths: [plugin.cfg, tools/build.py, tools/prepare_loxberry_release.py, tools/test_loxberry_release.py, .github/workflows/loxberry-release.yml]
permissions:
  contents: read
concurrency:
  group: plx-loxberry-0.1.5-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and inspect the LoxBerry-only package
        run: |
          python tools/prepare_loxberry_release.py
          python tools/test_loxberry_release.py
          python tools/check_docs.py
          python tools/check_branding.py dist/loxberry-0.1.5/PLX-LoxBerry-Plugin-0.1.5.zip
          cd dist/loxberry-0.1.5
          sha256sum --check SHA256SUMS
          python -c 'import json; d=json.load(open("manifest.json")); assert not d["source_dirty"]'
      - uses: actions/upload-artifact@v6
        with:
          name: plx-loxberry-0.1.5
          path: dist/loxberry-0.1.5/
          if-no-files-found: error
