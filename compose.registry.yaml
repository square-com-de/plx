services:
  plx:
    image: ghcr.io/square-com-de/plx:0.1.0
    ports:
      - "${PLX_BIND_ADDRESS:-127.0.0.1}:${PLX_PORT:-8443}:8443"
    environment:
      PLX_USERNAME: "${PLX_USERNAME:-admin}"
      PLX_PASSWORD_FILE: /run/secrets/plx_password
    secrets:
      - plx_password
    volumes:
      - plx_data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    pids_limit: 64
    mem_limit: 512m
secrets:
  plx_password:
    file: ./secrets/plx_password.txt
volumes:
  plx_data:
