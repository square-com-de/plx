services:
  plx:
    image: ghcr.io/square-com-de/plx:0.1.2
    ports:
      - "${PLX_BIND_ADDRESS:-0.0.0.0}:${PLX_PORT:-8443}:8443"
    environment:
      PLX_HOST: "${PLX_HOST:?Bitte IP oder DNS-Namen des Docker-Servers als PLX_HOST setzen}"
      PLX_USERNAME: "${PLX_USERNAME:-admin}"
    volumes:
      - plx_data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    pids_limit: 64
    mem_limit: 512m
volumes:
  plx_data:
